name: Downstream Impact Guard

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: downstream-impact-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  assess:
    name: downstream-impact
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    environment: lineage-guard
    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      DATABRICKS_WAREHOUSE_ID: ${{ vars.DATABRICKS_WAREHOUSE_ID }}
      DATABRICKS_SERVING_ENDPOINT: ${{ vars.DATABRICKS_SERVING_ENDPOINT }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Check out trusted base implementation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch untrusted head as data only
        shell: bash
        run: |
          cleanup_credentials() {
            git config --local --unset-all http.https://github.com/.extraheader || true
          }
          trap cleanup_credentials EXIT
          git fetch --no-tags origin \
            "refs/pull/${{ github.event.pull_request.number }}/head"
          test "$(git rev-parse FETCH_HEAD)" = "$HEAD_SHA"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install trusted checker
        run: python -m pip install .

      - name: Assess downstream impact
        id: assessment
        shell: bash
        run: |
          set +e
          python -m lineage_guard assess \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --output assessment.json \
            --markdown-output assessment.md
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Write job summary
        if: always()
        shell: bash
        run: cat assessment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload assessment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: downstream-impact-${{ github.event.pull_request.number }}
          path: |
            assessment.json
            assessment.md
          if-no-files-found: error

      - name: Create or update pull-request report
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const marker = '<!-- proactive-zero-ops-lineage-guard -->';
            const body = fs.readFileSync('assessment.md', 'utf8').slice(0, 65000);
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const previous = comments.find(comment =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );
            if (previous) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Enforce assessment
        if: always()
        shell: bash
        env:
          ASSESSMENT_EXIT_CODE: ${{ steps.assessment.outputs.exit_code }}
        run: exit "${ASSESSMENT_EXIT_CODE:-2}"
