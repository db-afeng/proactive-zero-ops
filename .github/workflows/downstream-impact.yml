name: Downstream Impact Guard

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: downstream-impact-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  assess:
    name: downstream-impact
    if: github.event.pull_request.draft == false
    # Set the repository variable LINEAGE_GUARD_RUNNER to a self-hosted or
    # larger-runner label with static egress when the workspace uses IP ACLs.
    runs-on: ${{ vars.LINEAGE_GUARD_RUNNER || 'ubuntu-latest' }}
    environment: lineage-guard
    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      DATABRICKS_WAREHOUSE_ID: ${{ vars.DATABRICKS_WAREHOUSE_ID }}
      DATABRICKS_SERVING_ENDPOINT: ${{ vars.DATABRICKS_SERVING_ENDPOINT }}
      LINEAGE_GUARD_RESTRICTED_VOLUME_ROOT: ${{ vars.LINEAGE_GUARD_RESTRICTED_VOLUME_ROOT || '/Volumes/proactive_zero_ops_catalog/proactive_zero_ops_guard/restricted_assessments' }}
      LINEAGE_IMPACT_STUDIO_URL: ${{ vars.LINEAGE_IMPACT_STUDIO_URL }}
      # This environment/repository variable is controlled by trusted CI
      # administrators, never by pull-request bundle configuration.
      DATABRICKS_BUNDLE_TARGET: ${{ vars.DATABRICKS_BUNDLE_TARGET || 'dev' }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Check out trusted workflow implementation
        uses: actions/checkout@v4
        with:
          # pull_request_target loads this workflow from the default branch, but
          # pull_request.base.sha can remain pinned to the PR's older comparison
          # base. Use the immutable trusted workflow commit so newly merged guard
          # commands are available without ever checking out PR-controlled code.
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch untrusted head as data only
        shell: bash
        run: |
          cleanup_credentials() {
            git config --local --unset-all http.https://github.com/.extraheader || true
          }
          trap cleanup_credentials EXIT
          git fetch --no-tags origin \
            "refs/pull/${{ github.event.pull_request.number }}/head"
          test "$(git rev-parse FETCH_HEAD)" = "$HEAD_SHA"

      - name: Set up Python on GitHub-hosted runners
        if: runner.environment == 'github-hosted'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Prepare restricted evidence storage
        if: always()
        shell: bash
        run: |
          restricted_dir="$RUNNER_TEMP/lineage-guard-restricted"
          if [[ -L "$restricted_dir" ]]; then
            exit 1
          fi
          mkdir -p "$restricted_dir"
          chmod 0700 "$restricted_dir"
          echo "LINEAGE_GUARD_RESTRICTED_DIR=$restricted_dir" >> "$GITHUB_ENV"

      - name: Create isolated Python environment
        shell: bash
        run: |
          python_bootstrap="$(command -v python3.12 || true)"
          if [[ -z "$python_bootstrap" ]]; then
            echo "Python 3.12 is required on a self-hosted lineage guard runner." >&2
            exit 1
          fi
          "$python_bootstrap" -c \
            'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
          "$python_bootstrap" -m venv --clear "$RUNNER_TEMP/lineage-guard-python"
          echo "LINEAGE_GUARD_PYTHON=$RUNNER_TEMP/lineage-guard-python/bin/python" \
            >> "$GITHUB_ENV"

      - name: Install trusted checker
        shell: bash
        run: |
          "$LINEAGE_GUARD_PYTHON" -m pip install .

      - name: Assess downstream impact
        id: assessment
        shell: bash
        run: |
          set +e
          umask 077
          "$LINEAGE_GUARD_PYTHON" -m lineage_guard assess \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --pull-request-number "${{ github.event.pull_request.number }}" \
            --target "$DATABRICKS_BUNDLE_TARGET" \
            --output assessment.json \
            --markdown-output assessment.md \
            --restricted-evidence-dir "$LINEAGE_GUARD_RESTRICTED_DIR" \
            > "$LINEAGE_GUARD_RESTRICTED_DIR/checker.log" 2>&1
          exit_code=$?
          find "$LINEAGE_GUARD_RESTRICTED_DIR" -type d -exec chmod 0700 {} +
          find "$LINEAGE_GUARD_RESTRICTED_DIR" -type f -exec chmod 0600 {} +
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish restricted assessment evidence
        id: publication
        if: always()
        shell: bash
        run: |
          set +e
          published=false
          publication_log=/dev/null
          if [[ -n "${LINEAGE_GUARD_RESTRICTED_DIR:-}" \
            && -d "$LINEAGE_GUARD_RESTRICTED_DIR" \
            && ! -L "$LINEAGE_GUARD_RESTRICTED_DIR" ]]; then
            publication_log="$LINEAGE_GUARD_RESTRICTED_DIR/publication.log"
          fi
          if [[ -n "${LINEAGE_GUARD_PYTHON:-}" && -x "$LINEAGE_GUARD_PYTHON" ]]; then
            "$LINEAGE_GUARD_PYTHON" -m lineage_guard publish-evidence \
              --public-assessment assessment.json \
              --restricted-evidence-dir "$LINEAGE_GUARD_RESTRICTED_DIR" \
              --volume-root "$LINEAGE_GUARD_RESTRICTED_VOLUME_ROOT" \
              --receipt-output "$LINEAGE_GUARD_RESTRICTED_DIR/publication-receipt.json" \
              > "$publication_log" 2>&1
            if [[ $? -eq 0 ]]; then
              published=true
              assessment_reference="$($LINEAGE_GUARD_PYTHON -c \
                'from pathlib import Path; from lineage_guard.disclosure import deserialize_public_artifact; print(deserialize_public_artifact(Path("assessment.json").read_bytes()).reference.value)' \
                2>> "$publication_log")"
              if [[ "$assessment_reference" =~ ^lgr_[A-Za-z0-9_-]{32}$ ]]; then
                echo "assessment_reference=$assessment_reference" >> "$GITHUB_OUTPUT"
              else
                published=false
              fi
            fi
          fi
          if [[ "$publication_log" != /dev/null ]]; then
            chmod 0600 "$publication_log"
          fi
          echo "published=$published" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Prepare allowlisted public assessment
        id: public
        if: always()
        shell: bash
        env:
          CHECKER_EXIT_CODE: ${{ steps.assessment.outputs.exit_code || '2' }}
          EVIDENCE_PUBLISHED: ${{ steps.publication.outputs.published || 'false' }}
        run: |
          umask 077
          public_python="${LINEAGE_GUARD_PYTHON:-}"
          if [[ -z "$public_python" ]]; then
            public_python="$(command -v python3.12 || command -v python3 || true)"
          fi
          public_log=/dev/null
          if [[ -n "${LINEAGE_GUARD_RESTRICTED_DIR:-}" \
            && -d "$LINEAGE_GUARD_RESTRICTED_DIR" \
            && ! -L "$LINEAGE_GUARD_RESTRICTED_DIR" ]]; then
            public_log="$LINEAGE_GUARD_RESTRICTED_DIR/public-preparation.log"
          fi
          if [[ -z "$public_python" ]]; then
            cat > assessment.json <<'JSON'
          {"assessment_reference":"lgr_T5Yg2b1Kq9Vw4Hd7Nx3Rc8Zm6Pf0JsUa","message":"The assessment could not be completed safely.","outcome":"error","schema_version":1}
          JSON
            cat > assessment.md <<'MARKDOWN'
          <!-- proactive-zero-ops-lineage-guard -->
          ## Downstream impact assessment

          ❌ **ERROR**

          The assessment could not be completed safely.

          Assessment reference: `lgr_T5Yg2b1Kq9Vw4Hd7Nx3Rc8Zm6Pf0JsUa`

          _Detailed evidence is restricted and requires authenticated, authorized access._
          MARKDOWN
            echo "exit_code=2" >> "$GITHUB_OUTPUT"
            echo "assessment_reference=lgr_T5Yg2b1Kq9Vw4Hd7Nx3Rc8Zm6Pf0JsUa" >> "$GITHUB_OUTPUT"
            chmod 0644 assessment.json assessment.md
            exit 0
          fi
          "$public_python" - "$GITHUB_OUTPUT" "$CHECKER_EXIT_CODE" "$EVIDENCE_PUBLISHED" <<'PY' \
            > "$public_log" 2>&1
          import json
          import re
          import secrets
          import sys
          from pathlib import Path

          messages = {
              "pass": "No blocking downstream impact was identified.",
              "warn": "The assessment completed with a non-blocking warning.",
              "block": "A potentially breaking downstream impact was identified.",
              "error": "The assessment could not be completed safely.",
          }
          icons = {"pass": "✅", "warn": "⚠️", "block": "⛔", "error": "❌"}
          exit_codes = {"pass": "0", "warn": "0", "block": "1", "error": "2"}
          required_keys = {
              "schema_version",
              "assessment_reference",
              "outcome",
              "message",
          }

          valid = False
          try:
              candidate = json.loads(Path("assessment.json").read_text(encoding="utf-8"))
              outcome = candidate["outcome"]
              reference = candidate["assessment_reference"]
              valid = (
                  isinstance(candidate, dict)
                  and set(candidate) == required_keys
                  and candidate["schema_version"] == 1
                  and outcome in messages
                  and candidate["message"] == messages[outcome]
                  and isinstance(reference, str)
                  and re.fullmatch(r"lgr_[A-Za-z0-9_-]{32}", reference) is not None
                  and sys.argv[2] == exit_codes[outcome]
                  and sys.argv[3] == "true"
              )
          except Exception:
              valid = False

          if valid:
              public = {key: candidate[key] for key in sorted(required_keys)}
              published_exit_code = exit_codes[public["outcome"]]
          else:
              reference = "lgr_" + secrets.token_urlsafe(24)
              public = {
                  "assessment_reference": reference,
                  "message": messages["error"],
                  "outcome": "error",
                  "schema_version": 1,
              }
              published_exit_code = "2"

          outcome = public["outcome"]
          markdown = "\n".join(
              [
                  "<!-- proactive-zero-ops-lineage-guard -->",
                  "## Downstream impact assessment",
                  "",
                  f"{icons[outcome]} **{outcome.upper()}**",
                  "",
                  public["message"],
                  "",
                  f"Assessment reference: `{public['assessment_reference']}`",
                  "",
                  "_Detailed evidence is restricted and requires authenticated, authorized access._",
                  "",
              ]
          )
          Path("assessment.json").write_text(
              json.dumps(public, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          Path("assessment.md").write_text(markdown, encoding="utf-8")
          with Path(sys.argv[1]).open("a", encoding="utf-8") as output:
              output.write(f"exit_code={published_exit_code}\n")
              output.write(f"assessment_reference={public['assessment_reference']}\n")
          PY
          if [[ "$public_log" != /dev/null ]]; then
            chmod 0600 "$public_log"
          fi
          chmod 0644 assessment.json assessment.md

      - name: Add authorized assessment link
        if: >-
          ${{ always()
              && steps.public.outcome == 'success'
              && steps.publication.outputs.published == 'true'
              && steps.public.outputs.assessment_reference == steps.publication.outputs.assessment_reference }}
        shell: bash
        run: |
          if [[ -z "${LINEAGE_IMPACT_STUDIO_URL:-}" ]]; then
            echo "LINEAGE_IMPACT_STUDIO_URL must be configured before assessment links are enabled." >&2
            exit 1
          fi
          "$LINEAGE_GUARD_PYTHON" -m lineage_guard render-public \
            --input assessment.json \
            --markdown-output assessment.md \
            --publication-receipt "$LINEAGE_GUARD_RESTRICTED_DIR/publication-receipt.json" \
            --volume-root "$LINEAGE_GUARD_RESTRICTED_VOLUME_ROOT" \
            --assessment-base-url "$LINEAGE_IMPACT_STUDIO_URL"

      - name: Write job summary
        if: ${{ always() && steps.public.outcome == 'success' }}
        shell: bash
        run: cat assessment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload public assessment
        if: ${{ always() && steps.public.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: downstream-impact-${{ github.event.pull_request.number }}
          path: |
            assessment.json
            assessment.md
          if-no-files-found: error
          retention-days: 7

      - name: Create or update pull-request report
        if: ${{ always() && steps.public.outcome == 'success' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const marker = '<!-- proactive-zero-ops-lineage-guard -->';
            const body = fs.readFileSync('assessment.md', 'utf8').slice(0, 65000);
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const previous = comments.find(comment =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );
            if (previous) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Enforce assessment
        if: always()
        shell: bash
        env:
          ASSESSMENT_EXIT_CODE: ${{ steps.public.outputs.exit_code || '2' }}
        run: exit "${ASSESSMENT_EXIT_CODE:-2}"
