[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "proactive-zero-ops-lineage-guard"
version = "0.1.0"
description = "Databricks lineage-grounded pull-request impact assessment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "databricks-openai>=0.8.0,<1",
  "databricks-sdk>=0.65.0,<1",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0.2,<7",
  "sqlglot==28.10.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
lineage-guard = "lineage_guard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lineage_guard"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
  ".agents",
  ".ai-dev-kit",
  ".claude",
  ".cursor",
  ".github/skills",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
