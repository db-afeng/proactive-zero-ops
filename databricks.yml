bundle:
  name: proactive-zero-ops

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog for the credit-risk demo.
    default: proactive_zero_ops_catalog
  bronze_schema:
    description: Bronze schema name.
    default: proactive_zero_ops_bronze
  silver_schema:
    description: Silver schema name.
    default: proactive_zero_ops_silver
  gold_schema:
    description: Gold schema name.
    default: proactive_zero_ops_gold
  lineage_impact_volume:
    description: Existing Unity Catalog Volume containing restricted assessment envelopes.
    default: proactive_zero_ops_catalog.proactive_zero_ops_guard.restricted_assessments
  lineage_impact_secret_scope:
    description: Databricks secret scope containing Lineage Impact Studio encryption material.
    default: lineage-impact-studio
  lineage_impact_encryption_secret_key:
    description: Secret key containing a canonical base64-encoded 32-byte encryption key.
    default: encryption-key

targets:
  dev:
    default: true
    workspace:
      host: https://fe-sandbox-proactive-zero-ops.cloud.databricks.com
    variables:
      catalog: proactive_zero_ops_catalog
      bronze_schema: proactive_zero_ops_bronze
      silver_schema: proactive_zero_ops_silver
      gold_schema: proactive_zero_ops_gold
