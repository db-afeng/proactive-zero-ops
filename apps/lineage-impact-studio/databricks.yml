bundle:
  name: lineage-impact-studio

variables:
  sql_warehouse_id:
    description: SQL warehouse used for user-authorized Unity Catalog checks
    lookup:
      warehouse: proactive-zero-ops-lineage-guard
  files_id:
    description: Three-level Unity Catalog name of the restricted assessment Volume
  postgres_branch:
    description: Full resource name of the Lakebase production branch
  postgres_database:
    description: Full resource name of the Lakebase databricks_postgres database
  secret_scope:
    description: Databricks secret scope containing application secrets
  encryption_secret_key:
    description: Secret key containing a canonical base64-encoded 32-byte encryption key
  github_client_id_secret_key:
    description: Secret key containing the GitHub App client ID
  github_client_secret_secret_key:
    description: Secret key containing the GitHub App client secret

resources:
  apps:
    app:
      name: 'lineage-impact-studio'
      description: 'Permission-aware lineage impact review and guided remediation for pull requests.'
      source_code_path: ./

      # Start the app automatically on deploy.
      lifecycle:
        started: true
      user_api_scopes:
        - sql
        - genie
        - workspace.workspace:read

      # The resources which this app has access to.
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.sql_warehouse_id}
            permission: CAN_USE
        - name: files
          uc_securable:
            securable_full_name: ${var.files_id}
            securable_type: VOLUME
            permission: READ_VOLUME
        - name: table-lineage
          uc_securable:
            securable_full_name: system.access.table_lineage
            securable_type: TABLE
            permission: SELECT
        - name: postgres
          postgres:
            branch: ${var.postgres_branch}
            database: ${var.postgres_database}
            permission: CAN_CONNECT_AND_CREATE
        - name: encryption-key
          secret:
            scope: ${var.secret_scope}
            key: ${var.encryption_secret_key}
            permission: READ
        - name: github-client-id
          secret:
            scope: ${var.secret_scope}
            key: ${var.github_client_id_secret_key}
            permission: READ
        - name: github-client-secret
          secret:
            scope: ${var.secret_scope}
            key: ${var.github_client_secret_secret_key}
            permission: READ

targets:
  default:
    default: true
    workspace:
      host: https://fe-sandbox-proactive-zero-ops-2.cloud.databricks.com

    variables:
      files_id: proactive_zero_ops_catalog.proactive_zero_ops_guard.restricted_assessments
      postgres_branch: projects/lineage-impact-studio/branches/production
      postgres_database: projects/lineage-impact-studio/branches/production/databases/databricks-postgres
      secret_scope: lineage-impact-studio
      encryption_secret_key: encryption-key
      github_client_id_secret_key: github-client-id
      github_client_secret_secret_key: github-client-secret
